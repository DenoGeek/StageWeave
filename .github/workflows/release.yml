# Release pipeline for StageWeave.
#
# Triggers
#   - Push a tag matching v* (e.g. `git tag v0.1.0 && git push origin v0.1.0`):
#     builds every installer and publishes them to the GitHub Release for that tag.
#     The tag must match the `version` in Cargo.toml (v0.1.0 <-> 0.1.0), or the run fails.
#   - Manual "Run workflow" (workflow_dispatch): builds every installer and uploads
#     them as workflow artifacts only (no release is created).
#
# Outputs (packaged with cargo-packager, config in Packager.toml)
#   Linux    stageweave_<ver>_amd64.deb          (built on Ubuntu 22.04 -> glibc 2.35+)
#   Windows  StageWeave_<ver>_x64-setup.exe      (NSIS, per-user install, no admin)
#   macOS    StageWeave_<ver>_aarch64.dmg        (Apple Silicon)
#            StageWeave_<ver>_x64.dmg            (Intel, cross-compiled on an arm64 runner;
#                                               the macos-13 Intel runner image is retired)
#   Android  StageWeave-Remote_<ver>.apk         (the phone remote, Flutter app in mobileapp/)
#
# Layout: the desktop app lives in software/, the phone remote in mobileapp/.
#
# Unsigned builds
#   macOS: the app is not signed or notarized, so Gatekeeper will say it "is damaged"
#   or "cannot be opened". After dragging StageWeave to Applications, either
#   right-click StageWeave.app -> Open -> Open, or run:
#       xattr -dr com.apple.quarantine /Applications/StageWeave.app
#   Windows: SmartScreen may warn about an unknown publisher -> "More info" -> "Run anyway".

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            formats: dmg
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            formats: dmg
    defaults:
      run:
        shell: bash
        working-directory: software

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libssl-dev

      # Toolchain version + components come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: software

      # cargo-packager ships no prebuilt binaries, so build it. rust-cache keeps
      # ~/.cargo/bin, and `cargo install` is a no-op when this version is cached.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "${CARGO_PACKAGER_VERSION}"

      # A standalone Packager.toml is not merged with Cargo.toml, so inject the
      # crate version and the per-target binaries dir here.
      - name: Sync Packager.toml with Cargo.toml
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "stageweave") | .version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read the stageweave version from Cargo.toml"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
          perl -pi.bak -e \
            "s|^version = \".*\"|version = \"${VERSION}\"|; s|^binariesDir = \".*\"|binariesDir = \"target/${TARGET}/release\"|" \
            Packager.toml
          rm -f Packager.toml.bak
          grep -E '^(version|binariesDir) = ' Packager.toml
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package installer
        run: cargo packager --release --formats ${{ matrix.formats }} --target ${{ matrix.target }}

      - name: List installers
        run: ls -la target/packages

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            software/target/packages/*.deb
            software/target/packages/*.exe
            software/target/packages/*.dmg

  android:
    name: Package (android remote)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobileapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true

      # The remote shares the desktop app's version (software/Cargo.toml).
      - name: Read version
        run: |
          VERSION=$(grep -m1 '^version = ' ../software/Cargo.toml | cut -d '"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match software/Cargo.toml version ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Optional release signing: set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets. Without them the APK is
      # signed with a debug key (installable, but updates need the same key).
      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::No Android signing secrets; the APK is signed with a debug key"
          fi

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        run: |
          BUILD_NUMBER=$(echo "$VERSION" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/StageWeave-Remote_${VERSION}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: installers-android
          if-no-files-found: error
          path: mobileapp/dist/*.apk

  release:
    name: Publish GitHub Release
    needs: [package, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Create release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads
            - **Windows**: `StageWeave_*_x64-setup.exe`
            - **macOS (Apple Silicon)**: `StageWeave_*_aarch64.dmg`
            - **macOS (Intel)**: `StageWeave_*_x64.dmg`
            - **Linux (Debian/Ubuntu)**: `stageweave_*_amd64.deb` (`sudo apt install ./stageweave_*_amd64.deb`)
            - **Android remote**: `StageWeave-Remote_*.apk`. Install it on a phone on the same Wi-Fi as StageWeave, then turn on **Remote control** in StageWeave's Settings. You may need to allow installing apps from your browser.

            These builds are not code-signed.
            - **macOS**: drag StageWeave into **Applications** first. If it then says the app "is damaged" or "can't be opened", run this in Terminal:

              ```sh
              xattr -dr com.apple.quarantine /Applications/StageWeave.app
              ```
            - **Windows**: on the SmartScreen prompt, click **More info**, then **Run anyway**.
